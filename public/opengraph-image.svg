      <stop offset="0%" stop-color="#7729c0" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.2;0.4;0.2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="transparent"/>
