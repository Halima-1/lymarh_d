  <circle cx="250" cy="500" r="260" fill="url(#pulse)"/>

  <!-- Text -->
  <text x="120" y="310" font-size="78" fill="#faf5ff" font-family="Poppins" font-weight="700">
    Halima Dahunsi
  </text>

  <text x="120" y="390" font-size="38" fill="rgba(250,245,255,0.72)">
Frontend/Blockchain Developer  </text>

  <text x="120" y="455" font-size="20" fill="rgba(250,245,255,0.85)">
